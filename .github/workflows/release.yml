# Pushing a tag `vX.Y.Z` publishes a GitHub release with prebuilt binaries and
# a Docker image on ghcr.io. The tag must match the version in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v$version" = "$TAG" || { echo "tag $TAG, Cargo.toml $version"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static binary: runs on any Linux distribution.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Install the musl linker
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - name: Upload the binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="wiki-llm-mcp-$TAG-$TARGET.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" wiki-llm-mcp
          gh release upload "$TAG" "$archive"

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and push the image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:${TAG#v}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${TAG#v}"
          docker push "$IMAGE:latest"
